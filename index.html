function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a}

function unhex(h){var a=new Uint8Array(h.length/2);for(var k=0;k<a.length;k++)a[k]=parseInt(h.substr(k*2,2),16);return a}
function open(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},k,u8(D.d))}).then(function(pt){return JSON.parse(new TextDecoder().decode(pt))})}
